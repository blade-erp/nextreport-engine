sonar.projectKey=nextreport_engine
sonar.organization=nextreport
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=NextReport Engine
sonar.projectVersion=0.1.0

# Source configuration — all package sources
sonar.sources=packages/schema/src,packages/engine-core/src,packages/renderer-html/src,packages/renderer-pdf/src,packages/canvas/src,packages/ui-designer/src,packages/ui-viewer/src,apps/web/app,apps/web/lib

# Test configuration
sonar.tests=packages/schema/src/__tests__,packages/engine-core/src/__tests__,packages/renderer-html/src/__tests__,packages/renderer-pdf/src/__tests__,packages/ui-designer/src/__tests__

# Exclusions — test files from source analysis, config files
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/*.config.ts,**/*.config.js,**/coverage/**

# Test inclusions
sonar.test.inclusions=**/*.test.ts,**/__tests__/**/*.ts

# Coverage — LCOV reports from all packages (comma-separated)
sonar.javascript.lcov.reportPaths=packages/schema/coverage/lcov.info,packages/engine-core/coverage/lcov.info,packages/renderer-html/coverage/lcov.info,packages/renderer-pdf/coverage/lcov.info,packages/ui-designer/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript configuration
sonar.typescript.tsconfigPaths=packages/schema/tsconfig.json,packages/engine-core/tsconfig.json,packages/renderer-html/tsconfig.json,packages/renderer-pdf/tsconfig.json,packages/canvas/tsconfig.json,packages/ui-designer/tsconfig.json,packages/ui-viewer/tsconfig.json

# Duplicate detection
sonar.cpd.minimumTokens=50
