name: Docker Build (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag / version (e.g. 1.2.3 or my-feature). Defaults to "manual".'
        required: false
        default: 'manual'
      push:
        description: 'Push the image to GHCR after building?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nextreport/engine

jobs:
  docker-build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-manual}"
          VERSION="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image details
        env:
          IMAGE_NAME_VAL: ${{ env.IMAGE_NAME }}
          TAG: ${{ steps.tag.outputs.tag }}
          PUSH: ${{ inputs.push }}
        run: |
          echo "Built image: $IMAGE_NAME_VAL:$TAG"
          echo "Pushed: $PUSH"
