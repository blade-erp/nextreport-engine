name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  PNPM_VERSION: '10.33.0'
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nextreport/engine

jobs:
  # ─────────────────────────────────────────────────────────────
  # Full CI gate
  # ─────────────────────────────────────────────────────────────
  test:
    name: CI Gate (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome
        working-directory: packages/renderer-pdf

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Build all packages
        run: pnpm run build

      - name: Run tests
        run: pnpm test
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

  # ─────────────────────────────────────────────────────────────
  # Publish ALL @nextreport/* packages to npm (dependency order)
  # ─────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish all packages to npm
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (with npm registry auth)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Publish all packages (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish in dependency order — each package depends on the previous
          PACKAGES=(
            "packages/schema"
            "packages/engine-core"
            "packages/renderer-html"
            "packages/renderer-pdf"
            "packages/canvas"
            "packages/ui-viewer"
            "packages/ui-designer"
            "packages/nextreport-engine"
          )

          for pkg_dir in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -e "console.log(require('./${pkg_dir}/package.json').name)")
            echo "Publishing ${PKG_NAME} from ${pkg_dir}..."
            cd "${pkg_dir}"
            npm publish --access public || echo "⚠ ${PKG_NAME} publish failed (may already exist at this version)"
            cd -
          done

  # ─────────────────────────────────────────────────────────────
  # Build and push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm]
    if: always() && needs.publish-npm.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
