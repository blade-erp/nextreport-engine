version: 2

updates:
  # ─────────────────────────────────────────
  # npm / pnpm workspace dependencies
  # ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      # Group all dev tools together (linting, formatting, testing)
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier*'
          - 'typescript*'
          - 'typescript-eslint*'
          - 'vitest*'
          - 'tsup'
          - 'turbo'
          - 'husky'
          - 'lint-staged'
      # Group all TypeScript type definitions
      types:
        patterns:
          - '@types/*'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'

  # ─────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    commit-message:
      prefix: 'ci(deps)'
